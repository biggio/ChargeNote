name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Restoring release keystore from secrets..."
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          else
            echo "Generating release keystore for CI build..."
            keytool -genkeypair -v -keystore release.keystore -alias releaseKey -keyalg RSA -keysize 2048 -validity 10000 -storepass chargenote2026 -keypass chargenote2026 -dname "CN=ChargeNote, OU=Mobile, O=ChargeNote, L=Taipei, ST=Taiwan, C=TW"
          fi
          cat <<EOF > keystore.properties
          storeFile=release.keystore
          storePassword=chargenote2026
          keyAlias=releaseKey
          keyPassword=chargenote2026
          EOF

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Prepare Release Asset
        run: |
          mkdir -p release-assets
          TAG_NAME="${{ github.ref_name }}"
          if [ -z "$TAG_NAME" ] || [ "$TAG_NAME" = "main" ]; then
            TAG_NAME="latest"
          fi
          cp app/build/outputs/apk/release/app-release.apk release-assets/ChargeNote-${TAG_NAME}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release-assets/*.apk
          generate_release_notes: true
